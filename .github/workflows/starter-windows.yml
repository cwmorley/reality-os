name: starter kit on Windows
# Runs on every pull request (not only starter changes) so it can be a
# required status check for main: people run the installer from main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-powershell-5:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Build a vault and test it with Windows PowerShell 5.1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File starter\tests\Test-Starter.ps1
